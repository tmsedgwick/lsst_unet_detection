[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lsst_unet_detection"
version = "0.1.0"
description = "Run a trained U-Net galaxy detector on LSST deep_coadd images"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Sedgwick", email = "t.m.sedgwick@outlook.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyarrow>=14", "scikit-learn>=1.3",
                "tensorflow>=2.16", "keras>=3.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["lsst_unet_detection*"]

[tool.ruff]
line-length = 120
